# Emulated FP64 GEMM benchmark - all combinations
# M=N=K=4096, function=matmul

# === Baseline: Native FP64 ===

# CLI: mblas-bench -m 4096 -n 4096 -k 4096 --precision f64_r --compute_type MBLAS_COMPUTE_64F --function matmul --driver ${DRIVER}
