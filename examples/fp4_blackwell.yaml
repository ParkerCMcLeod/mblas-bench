# FP4 E2M1 GEMM examples - requires Blackwell (SM 10.0+) and CUDA >= 12.8
# FP4 matmul requires block scaling (scale_mode=3)
# Pass --driver cublaslt on the command line

# FP4 x FP4 -> BF16 with block scaling
# CLI: mblas-bench -m 2048 -n 2048 -k 2048 --a_type f4_r --b_type f4_r --c_type bf16_r --d_type bf16_r --compute_type f32_r --function matmul --transA T --transB N --iters 10 --cold_iters 2 --scale_mode_a 3 --scale_mode_b 3 --driver cublaslt
- {m: 2048, n: 2048, k: 2048, a_type: f4_r, b_type: f4_r, c_type: bf16_r, d_type: bf16_r, compute_type: f32_r, function: matmul, transA: T, transB: N, iters: 10, cold_iters: 2, scale_mode_a: 3, scale_mode_b: 3}

