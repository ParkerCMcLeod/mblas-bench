# AMD rocBLAS-specific examples - typed GEMM functions and gemm_ex
# Pass --driver rocblas on the command line

# FP64 Dgemm (typed)
# CLI: mblas-bench -m 2048 -n 2048 -k 2048 --precision d --function rocblas_dgemm --transA N --transB T --initialization trig_float --iters 10 --cold_iters 2 --driver rocblas
- {m: 2048, n: 2048, k: 2048, precision: d, function: rocblas_dgemm, transA: N, transB: T, initialization: trig_float, iters: 10, cold_iters: 2}

